<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="container">
        <h2>Rock Paper Scissor Game</h2>
        <div class="buttons">
             <button class="rock">Rock</button>
             <button class="paper">Paper</button>
             <button class="scissor">Scissor</button>
             <button class="reset">Reset</button>
        </div>
       

    </section>
</body>
<style>
    body{
        height: 100vh;
        background: linear-gradient(to bottom, #667eea 2%, #764ba2 50%, #f093fb) 90%;
        color: #ffffff;
        display: flex;
        justify-content: center;
    }
    h2{
        text-shadow: 0 2px 4px #2d1b4e;
        font-size: clamp(1.5rem, 4vw,3rem);
        justify-self: center;
    }
    .buttons{
        justify-self: center;
    }
    button {
        background: linear-gradient(to bottom, #f38b46 2%, #dd7a37 50%, #be682e 100%);
        color: #2d1b4e;
        border: none;
        padding: 16px 48px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 1.2rem;
        box-shadow: 0 4px 0px #963e04,
                    0 6px 8px rgba(0, 0, 0, .3),
                    0 10px 6px rgba(0, 0, 0, .3),
                    inset 0 1px 0px #f5c684;
        transition: all .4s ease;
    }
    button:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
        box-shadow: 0 5px 0px #963e04,
                    0 8px 8px rgba(0, 0, 0, .3),
                    0 16px 6px rgba(0, 0, 0, .3),
                    inset 0 1px 0px #f5c684;
  
    }

    button:active {
        filter: brightness(.95);
         transform: translateY(0);
        box-shadow: 0 4px 0px #963e04,
                    0 6px 8px rgba(0, 0, 0, .3),
                    0 10px 6px rgba(0, 0, 0, .3),
                    inset 0 1px 0px #f5c684;
  
    }

</style>
<script>
    const record = {
        Win: 0,
        Lose: 0,
        Tie: 0
    }
    let clickedButton = '';

    const buttons = document.querySelectorAll('button');

    buttons.forEach((button) => {
    button.addEventListener('click', () => {
     clickedButton = button.textContent;

      if (clickedButton === 'Reset') {
      record.Win = 0;
      record.Lose = 0;
      record.Tie = 0;
      console.log(record);
      return;                      // stop here, skip the game code below
    }

     const resulttost = flipcoin();

     let gameresult = '';
       
            if (clickedButton === 'Rock'){
                gameresult = (resulttost === 'Rock') ? 'Tie' :
                    resulttost === 'Paper' ? 'Lose' : 'Win';

            } else if (clickedButton === 'Paper'){
                gameresult = (resulttost === 'Rock') ? 'Win' :
                    resulttost === 'Paper' ? 'Tie' : 'Lose';

            } else if(clickedButton === 'Scissor'){
                gameresult = (resulttost === 'Rock') ? 'Lose' :
                    resulttost === 'Paper' ? 'Win' : 'Tie';

            }
             

        console.log(gameresult);

        if (gameresult in record){
            record[gameresult] += 1;
        }
        console.log(record);
        console.log(`You picked ${clickedButton}. Computer picked ${resulttost}. ${gameresult.toLowerCase()}.`);
    });
    });

    function flipcoin(){
        const tost = Math.random();
        return  (tost < 1 / 3) ? 'Rock' :
                (tost < 2 / 3) ? 'Paper' : 'Scissor';
    }
    
</script>
</html>
