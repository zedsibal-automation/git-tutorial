<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <section class="game">
        <h3>Rock Paper Scissors</h3>

        <button onclick="

            playGame('rock');

        " class="rock">Rock</button>


        <button onclick="
        
            playGame('paper');
                    
        " class="paper">Paper</button>

        <button onclick="
        
            playGame('scissor');
        
        " class="scissors">Scissors</button>

        <p>
            <a href="">Click here</a> to see the final versioin of the project.
        </p>

    </section>

     <script>

        function playGame(playerMove){

            const computerMove = pickComputerChoice();
            
            let result = '';

            if (playerMove === 'scissor'){
                
                if (computerMove === 'rock'){result = 'You lost.';}
                else if (computerMove === 'paper'){result = 'You won.';}
                else if (computerMove === 'scissor'){result = 'Tie.';}
                
            } else if (playerMove === 'rock'){

               if (computerMove === 'rock'){result = 'Tie.';}
                else if (computerMove === 'paper'){result = 'You lost.';}
                else if (computerMove === 'scissor'){result = 'You won.';}

            } else if (playerMove === 'paper'){

                if (computerMove === 'rock'){result = 'You won.';}
                else if (computerMove === 'paper'){result = 'Tie.';}
                else if (computerMove === 'scissor'){result = 'You lost.';}

            }
       
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);

        }

       function pickComputerChoice() {

        const randomNumber = Math.random();
        
        let computerMove = '';
            
            if(randomNumber >= 0 && randomNumber < 1 / 3){computerMove = 'rock';}
            else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3){computerMove = 'paper';}
            else{computerMove = 'scissor';}

            return computerMove;
       }

    </script>

    
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        .game{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, blue 20%, rgb(3, 3, 148) 49%, rgb(3, 3, 87) 99%) no-repeat center center / contain;
            height: 100vh;
        }
        h3{
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            color: rgb(231, 231, 25);
            padding: 20px;
        }
        button{
            width: 200px;
            margin: 10px;
            padding: 8px 24px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            border: 2px solid rgba(9, 9, 241, 0.9);
            background: transparent;
            color: rgb(208, 211, 211);
            transition: all .3s ease;
        }

        button:hover{
            background: linear-gradient(to bottom, rgb(5, 231, 73) 20%, rgb(5, 150, 53) 50%, rgb(4, 112, 36) 99%);
            color: rgb(7, 0, 100);
        }
        p, a{
            text-decoration: none;
            color: yellowgreen;
            font-size: 1.3rem;
            padding-top: 20px;
        }
    </style>

   
</body>
</html>
