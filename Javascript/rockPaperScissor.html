<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="game">
  <h2>Rock Paper Scissor's Game</h2>
  <div class="mybuttons">
    <button class="rock" data-move="Rock"><img src="iimg/Glossy Rock Fist Emoji.png" alt="rock hand image" class="rockIcon"></button>
    <button class="paper" data-move="Paper"><img src="iimg/Cartoon Open Palm Sticker.png" alt="paper hand image" class="paperIcon"></button>
    <button class="scissor" data-move="Scissor"><img src="iimg/scissors_transparent.png" alt="scissor hand image" class="scissorIcon"></button>
  </div>
  <div class="checkResult">
    <section class="player">
      <h4>Player</h4>
      <button class="playerSide"><img src="" alt=""></button>
    </section>
    <section class="whoWin">
      <h4 class="winResult">Who win</h4>
    </section>
    <section class="computer">
      <h4>Computer</h4>
      <button class="computerSide"><img src="" alt=""></button>
    </section>
  </div>
  <p class="scoreboard">Win: 0 Losses: 0 Ties: 0</p>
  <button class="reset">Reset Score</button>
</section>
        

<style>
    body{
        height: 100vh;
        background: linear-gradient(135deg, #09090b 0%, #1a1033 60%, #2d1b69 100%);
        display: flex;
        justify-content: center;    
    }
    h2{
        color: #f4f4f8;
        padding: 20px 30px;
    }    

    p{
        color: #a1a1c0;
        align-self: center;
        padding: 30px;
        font-size: 1.3rem;
    }
    :root {
  --accent: #8b5cf6;
  --accent-dark: #6d3fe0;
  --accent-light: #a78bfa;
  --text: #f4f4f8;
  --muted: #a1a1c0;
}

/* Base: shared by every button */
.mybuttons button {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 12px 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  color: #ffffff;
  background: linear-gradient(to bottom, var(--accent), var(--accent-dark));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    0 4px 12px rgba(0, 0, 0, 0.4),
    0 8px 24px rgba(139, 92, 246, 0.25);
}

.mybuttons button:hover {
  background: linear-gradient(to bottom, var(--accent-light), var(--accent));
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.3),
    0 6px 16px rgba(0, 0, 0, 0.45),
    0 12px 32px rgba(139, 92, 246, 0.4);
  outline: 3px solid #a78bfa;
  outline-offset: 4px;
}

.mybuttons button:active {
  transform: translateY(0) scale(0.97);
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, 0.3),
    0 2px 6px rgba(0, 0, 0, 0.4);
  outline: none;
}

/* Keyboard focus: important for accessibility */
.mybuttons button:focus-visible {
  outline: 3px solid var(--accent-light);
  outline-offset: 3px;
}

/* Secondary: less important actions (Reset Score) */
.reset {
  background: rgba(255, 255, 255, 0.06);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: none;
}

.reset:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.3);
  box-shadow: none;
}

/* Disabled */
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
    .game{
        display: flex;
        flex-direction: column;

    }
    .mybuttons{
        display: flex;
        justify-content: space-between;
    }

 .rockIcon, .paperIcon, .scissorIcon {
  height: 50px;
}
.mybuttons button,
.checkResult button{
  border-radius: 80px;
  width: 80px;
  height: 80px;
  padding: 0;            /* remove the 12px 28px from the base rule */
  border-radius: 50%;    /* 50% always gives a perfect circle on a square */
  display: flex;
  align-items: center;
  justify-content: center; 
 
}
.checkResult{
  margin-top: 20px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);   /* Safari */
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 20px;
  padding: 20px 24px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),   /* bright top edge */
    0 8px 32px rgba(0, 0, 0, 0.45);            /* drop shadow */
  
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.checkResult button{
  border: none;
  background: transparent;
  box-shadow: none;
  pointer-events: none;
}
.checkResult h4{
   color: #fff;
}
.player,
.computer{
  display: flex;
  flex-direction: column;
  align-items: center;
}
.playerSide img,
.computerSide img{
  height: 50px;
}
.playerSide img[src=""],
.computerSide img[src=""]{
  visibility: hidden;
}

.reset {
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  /* ...your existing rules */
}
</style>

<script>
const clickedbutton = document.querySelectorAll('.mybuttons button');
const scoreText = document.querySelector('.scoreboard');
const reset = document.querySelector('.reset');
const images = {
  Rock: 'iimg/Glossy Rock Fist Emoji.png',
  Paper: 'iimg/Cartoon Open Palm Sticker.png',
  Scissor: 'iimg/scissors_transparent.png',
}

const moves = ['Rock','Paper','Scissor'];

const playerImg = document.querySelector('.playerSide img');
const computerImg = document.querySelector('.computerSide img');
const winResult = document.querySelector('.winResult');

const resultText = {
  Win: 'You win!',
  Losses: 'You lose!',
  Tie: 'Its a tie',
};

 

const scoreboard = {
    Win: 0,
    Losses: 0,
    Tie: 0
};

function updateScoreboard(){
    scoreText.textContent = `Wins: ${scoreboard.Win}, Losses: ${scoreboard.Losses}, Tie: ${scoreboard.Tie}`;
 }

       
      

        function playGame(){
            const computerNumericMove = Math.random();
            return computerNumericMove < 1 / 3 ? 'Rock' :
            computerNumericMove < 2 /3 ? 'Paper' : 'Scissor';
        }

        function checkResult(playerMove, computerMove){
                if (playerMove === computerMove) return 'Tie';

                if (
                    (playerMove === 'Rock' && computerMove === 'Scissor') ||
                    (playerMove === 'Paper' && computerMove === 'Rock')   ||
                    (playerMove === 'Scissor' && computerMove === 'Paper')

                ){
                    return 'Win';
                }

                return 'Losses';
        }
function setButtonDisabled(disabled){
   clickedbutton.forEach((b) => (b.disabled = disabled));
  reset.disabled = disabled;
}
clickedbutton.forEach((button)=>{
    button.addEventListener('click', () => {
        const playerMove = button.dataset.move;
        const computerMove = playGame();
        const result = checkResult(playerMove, computerMove);
       
        setButtonDisabled(true);
        playerImg.src = images[playerMove];
        winResult.textContent = '...';

        let i = 0;
        const shuffle = setInterval(() => {
          computerImg.src= images[moves[i % moves.length]];
          i++;

        }, 100);

        setTimeout(() => {
        clearInterval(shuffle);                 // stop cycling
        computerImg.src = images[computerMove]; // land on the real move
        winResult.textContent = resultText[result];

        scoreboard[result] += 1;
        updateScoreboard();
        setButtonDisabled(false);  
        console.log(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}`);
        console.log(scoreboard);
        }, 1500);
    });
});

reset.addEventListener('click', () => {
    scoreboard.Win = 0;
    scoreboard.Losses = 0;
    scoreboard.Tie = 0;

    updateScoreboard();
})

</script>
</body>
</html>
