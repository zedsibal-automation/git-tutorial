<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="guessingGame">
        <h3 class="title">Guessing game</h3>
        <div class="rotatingSection">
            <button class="rotatingNo">0</button>
        </div>
        <input type="number" id="inputtextbox" min="1" max="20">
        <label for="inputtextbox" class="instructionLabel">Enter a number from 1 to 20</label>
        <button class="guessbtn">Play</button>
        <button class="resetbtn">Reset</button>

        <div class="scoreboard">
            <h5>Score</h5>
            <div class="score">
                <div class="try">
                    <label for="tryNo">Try</label>
                    <input type="number" id="tryLeft" value="5" disabled>
                </div>
                <div class="losses">
                    <label for="tryNo">Losses</label>
                    <input type="number" id="losses" value="0" disabled>
                </div>
                <div class="win">
                    <label for="win">Win</label>
                    <input type="number" id="win" value="0" disabled>
                </div>
            </div>
        </div>
    </section>
    
</body>
<style>
    body{
        height: 100vh;
        background: linear-gradient(
                     135deg,
                    #3cf0f0 0%,
                    #2fc7c7 50%,
                    #12a7a7 100%
                    )no-repeat center center / cover;
        color:#713F12;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-shadow: 0 2px 3px #713F12;
        font-size: 2rem;
    
    }
    .guessingGame{
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1F2937, #253347);
        padding: 18px 28px;
        gap: 1.3rem;
        justify-content: center;
        align-items: center;
        border-radius: 18px;
        color: #FFFFFF;
        width: 700px;
        box-shadow: 2px 2px 9px rgb(0 0 0 / .9);
        border: 1px solid rgba(250, 250, 250, .6);
    }
    .instructionLabel{
        font-size: 1.3rem;
    }
    .guessbtn{
        background: #1F2937;
        border: 1px solid rgba(250, 250, 250, .6);
        padding: 12px 84px;
        color: #FFFFFF;
        border-radius: 999px;
        font-size: 1.1rem;
        transition: all .3s ease;
        
    }
    .guessbtn:hover:not(:disabled) {
        color: #FEF08A;
        box-shadow: 0 0 0 2px #FEF08A;
    }
    .guessbtn:disabled{
        opacity: .5;
        cursor: not-allowed;
         background: #6B7280;
        color: #D1D5DB;
        border-color: #9CA3AF;
    }

    .guessbtn:active:not(:disabled){
        transform: scale(.97);
        border: 1px solid #FFFFFF;
        color: #FFFFFF;
        font-size: 1.1rem;
    }
    #inputtextbox{
        width: 50%;
        padding: 12px 14px;
        color: #1F2937;
        border: 1px solid #D1D5DB;
        font-size: 1.2rem;
        border-radius: 8px;
        transition: border-color .2s ease,
                    box-shadow .2s ease;
    }
    #inputtextbox::placeholder{
        color: #9CA3AF;
    }

    #inputtextbox:focus:not(:disabled){
        border-color: #2563EB;
        box-shadow: 0 0 0 4px rgb(37 99 235 / 15%);
        outline: none;
    }
    #inputtextbox:disabled{
        background-color: #374151;
        color: #9CA3AF;
        border-color: #4B5563;
        cursor: not-allowed;
        opacity: 0.8;
    }
    .rotatingNo{
        background: transparent;
        border: none;
        width: 80px;
        height: 80px;
        font-size: 5.4rem;
        color: #FFFFFF;
        pointer-events: none;
        margin-left: auto;
        margin-right: auto;
    }
    .scoreboard{
        box-sizing: border-box;
        padding: 4px 14px 18px 14px;
        background: white;
        color: #1F2937;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        margin-bottom: 20px;
        box-shadow: 0 0px 18px rgba(240, 237, 237, .4);
        outline:1px solid #1F2937;
    }
    .scoreboard h5{
        margin: 10px;
        display: flex;
        justify-content: center;
        text-shadow: none;
    }
    .scoreboard label{
        font-size: 1.1rem;
        font-weight: 600;
        text-shadow: none;
    }
    .score{
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        
    }
    .try,
    .losses,
    .win {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .score input{
        margin-top: 8px;
        border-radius: 4px;
        font-size: 1.1rem;
        padding: 4px ;
        border: none;
        text-align: center;
        background-color: transparent;
    }
    .resetbtn{
        background:  rgba(250, 250, 250, .6);
        border: 1px solid #1F2937;
        padding: 12px 84px;
        color: #1F2937;
        border-radius: 999px;
        font-size: 1.1rem;
        margin-bottom: 20px;
        transition: all .3s ease;
    }
    .resetbtn:hover{
        box-shadow: 0 0 0 2px rgba(250, 250, 250, .6);
    }
    .resetbtn:active{
        transform: scale(.97);
    }
</style>
<script>
   
 
    
const rotatingNo = document.querySelector('.rotatingNo');
const inputtextbox = document.getElementById('inputtextbox');
const guessbtn = document.querySelector('.guessbtn');
const instructionLabel = document.querySelector('.instructionLabel');
const reset = document.querySelector('.resetbtn');

// Scoreboard elements
const winInput = document.getElementById('win');
const lossesInput = document.getElementById('losses');
const triesLeftInput = document.getElementById('tryLeft');

// Load saved scores
let winCount = Number(localStorage.getItem('win')) || 0;
let lossesCount = Number(localStorage.getItem('losses')) || 0;

// Game variables
let triesLeftCount = 5;
let gameOver = false;
let secretNumber = Math.floor(Math.random() * 20) + 1;

let rotatingInterval;
let animationTimeout;

// Display initial scores
winInput.value = winCount;
lossesInput.value = lossesCount;
triesLeftInput.value = triesLeftCount;

// Reset the game and scores
reset.addEventListener('click', () => {
    // Stop any animation still running
    clearInterval(rotatingInterval);
    clearTimeout(animationTimeout);

    // Reset game state
    triesLeftCount = 5;
    gameOver = false;
    secretNumber = Math.floor(Math.random() * 20) + 1;

    // Reset saved scores
    winCount = 0;
    lossesCount = 0;

    localStorage.setItem('win', 0);
    localStorage.setItem('losses', 0);

    // Update scoreboard
    winInput.value = 0;
    lossesInput.value = 0;
    triesLeftInput.value = 5;

    // Reset interface
    rotatingNo.textContent = '0';
    inputtextbox.value = '';
    inputtextbox.disabled = false;
    guessbtn.disabled = false;
    instructionLabel.textContent = 'Enter a number from 1 to 20';
});

// Play the game
guessbtn.addEventListener('click', () => {
    if (gameOver) return;

    const userGuess = inputtextbox.valueAsNumber;

    // Validate input
    if (
        inputtextbox.value === '' ||
        !Number.isInteger(userGuess) ||
        userGuess < 1 ||
        userGuess > 20
    ) {
        instructionLabel.textContent =
            'Enter a whole number from 1 to 20';
        return;
    }

    // Prevent repeated clicks during animation
    guessbtn.disabled = true;
    inputtextbox.disabled = true;

    instructionLabel.textContent = 'Picking a random number...';

    // Animate numbers
    rotatingInterval = setInterval(() => {
        rotatingNo.textContent =
            Math.floor(Math.random() * 20) + 1;
    }, 100);

    animationTimeout = setTimeout(() => {
        clearInterval(rotatingInterval);

        // Reveal the fixed secret number
        rotatingNo.textContent = 'X';

        // Use one try for this valid guess
        triesLeftCount--;
        triesLeftInput.value = triesLeftCount;

        if (userGuess === secretNumber) {
            winCount++;

            localStorage.setItem('win', winCount);
            winInput.value = winCount;
            rotatingNo.textContent = 'O';
            instructionLabel.textContent = 'You win! 🎉';

            endGame();

        } else if (triesLeftCount === 0) {
            // Count one loss for the entire round
            lossesCount++;

            localStorage.setItem('losses', lossesCount);
            lossesInput.value = lossesCount;

            instructionLabel.textContent =
                `Game over! The correct number was ${secretNumber}.`;

            endGame();

        } else {
            instructionLabel.textContent =
                `Wrong guess! You have ${triesLeftCount} tries left.`;

            inputtextbox.value = '';
            inputtextbox.disabled = false;
            guessbtn.disabled = false;
            inputtextbox.focus();
        }
    }, 2000);
});

// Stop the round after a win or when tries run out
function endGame() {
    gameOver = true;
    guessbtn.disabled = true;
    inputtextbox.disabled = true;
}
    console.log(secretNumber);
</script>
</html>
